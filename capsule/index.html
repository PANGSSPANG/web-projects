<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>扭蛋</title>
    <style>
      :root {
        --bg: #f8f6f2;
        --ink: #201d1a;
        --ink-soft: #4a443c;
        --muted: #8f877a;
        --card-bg: #ffffff;
        --border: #ece7df;
        --shadow: 0 24px 60px -32px rgba(32, 29, 26, 0.28);
        --radius: 24px;
        --sans: "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans SC",
          system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        font-family: var(--sans);
        background: var(--bg);
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      .page {
        position: relative;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        cursor: pointer;
        user-select: none;
      }

      /* ---- 顶栏 ---- */
      .topbar {
        width: 100%;
        max-width: 720px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 28px 24px 0;
      }

      .brand {
        font-size: 19px;
        font-weight: 700;
        letter-spacing: 0.5px;
      }

      .gear {
        width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        border: 1px solid var(--border);
        border-radius: 50%;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        transition: color 160ms, background 160ms;
      }

      .gear:hover {
        color: var(--ink);
        background: var(--card-bg);
      }

      /* ---- 舞台与卡片 ---- */
      .stage {
        flex: 1;
        width: 100%;
        max-width: 720px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .card {
        position: relative;
        width: 100%;
        max-width: 560px;
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 44px 40px;
        animation: pop-in 320ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      .tag {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        font-weight: 600;
        color: var(--accent);
        background: var(--tint);
        padding: 6px 12px;
        border-radius: 999px;
      }

      .tag::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
      }

      .tag em {
        font-style: normal;
        font-weight: 500;
        opacity: 0.7;
      }

      .card-body {
        margin-top: 24px;
      }

      .body-joke {
        margin: 0;
        font-size: 26px;
        line-height: 1.65;
        color: var(--ink);
      }

      .body-foreign {
        margin: 0;
        font-size: 28px;
        line-height: 1.5;
        font-weight: 500;
        color: var(--ink);
      }

      .translation {
        margin: 14px 0 0;
        font-size: 18px;
        line-height: 1.6;
        color: var(--muted);
      }

      .lang-tag {
        margin: 16px 0 0;
        font-size: 13px;
        font-weight: 600;
        color: var(--accent);
      }

      .body-title {
        margin: 0;
        font-size: 24px;
        font-weight: 700;
        line-height: 1.4;
        color: var(--ink);
      }

      .body-author {
        margin: 10px 0 0;
        font-size: 15px;
        font-weight: 600;
        color: var(--accent);
      }

      .body-text {
        margin: 18px 0 0;
        font-size: 18px;
        line-height: 1.7;
        color: var(--ink-soft);
      }

      .body-reco {
        margin: 22px 0 0;
        padding-top: 18px;
        border-top: 1px solid var(--border);
        font-size: 16px;
        line-height: 1.6;
        color: var(--ink-soft);
      }

      .body-reco::before {
        content: "推荐理由";
        margin-right: 8px;
        font-weight: 600;
        color: var(--accent);
      }

      /* ---- 加载遮罩 ---- */
      .veil {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(248, 246, 242, 0.55);
        border-radius: var(--radius);
        backdrop-filter: blur(2px);
      }

      .veil-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }

      .spinner {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 3px solid var(--accent, #cfc8bb);
        border-top-color: transparent;
        animation: spin 0.7s linear infinite;
      }

      .loading-label {
        font-size: 14px;
        color: var(--muted);
      }

      /* ---- 首次加载（无卡片） ---- */
      .boot {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }

      .boot-hint {
        font-size: 16px;
        color: var(--muted);
      }

      /* ---- 错误与提示 ---- */
      .error {
        position: fixed;
        left: 50%;
        bottom: 84px;
        transform: translateX(-50%);
        margin: 0;
        padding: 10px 16px;
        font-size: 14px;
        color: #b0423a;
        background: #fbe9e7;
        border: 1px solid #f2c9c4;
        border-radius: 12px;
        max-width: 90vw;
      }

      .hint {
        padding: 0 24px 28px;
        margin: 0;
        font-size: 14px;
        color: var(--muted);
      }

      /* ---- 设置弹窗 ---- */
      .overlay {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(32, 29, 26, 0.35);
        padding: 24px;
        z-index: 10;
      }

      .modal {
        position: relative;
        width: 100%;
        max-width: 400px;
        background: var(--card-bg);
        border-radius: 20px;
        padding: 28px 26px;
        box-shadow: var(--shadow);
      }

      .modal-close {
        position: absolute;
        top: 14px;
        right: 14px;
        width: 30px;
        height: 30px;
        border: none;
        background: transparent;
        font-size: 22px;
        line-height: 1;
        color: var(--muted);
        cursor: pointer;
      }

      .modal-title {
        margin: 0 0 12px;
        font-size: 19px;
        font-weight: 700;
      }

      .modal-hint {
        margin: 0 0 16px;
        font-size: 14px;
        line-height: 1.6;
        color: var(--ink-soft);
      }

      .modal-hint a {
        display: inline-block;
        margin-top: 4px;
        color: var(--accent, #3b6fd4);
        text-decoration: none;
        font-weight: 600;
      }

      .modal-input {
        width: 100%;
        padding: 12px 14px;
        font-size: 15px;
        font-family: var(--sans);
        color: var(--ink);
        background: #fbfaf8;
        border: 1px solid var(--border);
        border-radius: 12px;
        outline: none;
      }

      .modal-input:focus {
        border-color: var(--accent, #3b6fd4);
      }

      .btn-primary {
        width: 100%;
        margin-top: 14px;
        padding: 12px 16px;
        font-size: 15px;
        font-weight: 600;
        font-family: var(--sans);
        color: #fff;
        background: #201d1a;
        border: none;
        border-radius: 12px;
        cursor: pointer;
      }

      .btn-primary:disabled {
        background: #cfc8bb;
        cursor: not-allowed;
      }

      /* ---- 动画 ---- */
      @keyframes pop-in {
        from {
          opacity: 0;
          transform: translateY(10px) scale(0.99);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .card {
          animation: none;
        }
        .spinner {
          animation: none;
        }
      }

      @media (max-width: 560px) {
        .card {
          padding: 32px 24px;
        }
        .body-joke {
          font-size: 22px;
        }
        .body-foreign {
          font-size: 24px;
        }
        .body-title {
          font-size: 21px;
        }
      }
    </style>
  </head>
  <body>
    <div class="page" id="page">
      <header class="topbar">
        <span class="brand">扭蛋</span>
        <button class="gear" id="gear" aria-label="设置">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3" />
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
          </svg>
        </button>
      </header>

      <main class="stage" id="stage"></main>

      <p class="error" id="error" hidden></p>

      <footer class="hint">点一下，扭一个</footer>

      <div class="overlay" id="overlay" hidden>
        <div class="modal" role="dialog" aria-modal="true" aria-label="设置 API key">
          <button class="modal-close" id="modal-close" aria-label="关闭">×</button>
          <h2 class="modal-title">设置 API key（可选）</h2>
          <p class="modal-hint">
            API key 可选：填了就用 DeepSeek 实时生成，不填也能用内置内容库。key 只保存在你本机浏览器里，不会上传。
            <a href="https://platform.deepseek.com/" target="_blank" rel="noreferrer">去获取 →</a>
          </p>
          <input class="modal-input" id="api-key-input" type="password" placeholder="sk-..." />
          <button class="btn-primary" id="save-btn">保存</button>
        </div>
      </div>
    </div>

    <script>
      (function () {
        'use strict'

        var STORAGE_KEY = 'capsule.apiKey'
        var API_URL = 'https://api.deepseek.com/chat/completions'
        var MODEL = 'deepseek-chat'

        var CATEGORIES = [
          { id: 'joke', label: '笑话', labelEn: 'joke', color: '#e07a2f', tint: '#f9e9d8' },
          { id: 'foreign', label: '外语', labelEn: 'phrase', color: '#3b6fd4', tint: '#e3ebfa' },
          { id: 'knowledge', label: '知识点', labelEn: 'fact', color: '#2e9e6b', tint: '#e0f2e8' },
          { id: 'book', label: '书', labelEn: 'book', color: '#7a5cc7', tint: '#eae4f8' },
        ]

        // 每个分类一份提示词，强制输出 JSON，并加防编造约束。
        var PROMPTS = {
          joke: [
            '你是一个讲中文短笑话的助手。',
            '生成一个原创、干净、简短的笑话，两三句以内，纯文字，不要标题、不要解释。',
            '只输出 json，格式：{"content":"笑话正文"}',
          ].join(' '),
          foreign: [
            '你是一个语言学习助手。',
            '随机选一种常见外语（英语、日语、法语、西班牙语、德语、韩语等），给一句日常实用的句子。',
            '语法必须正确，附中文翻译，并标出语种的中文名。',
            '只输出 json，格式：{"language":"语种中文名","original":"外文原句","translation":"中文翻译"}',
          ].join(' '),
          knowledge: [
            '你是一个科普助手，给一个常识级、可验证的知识点。',
            '必须是公认事实，不要冷门数据，不要编造统计数字，不要有争议的观点。',
            '只输出 json，格式：{"title":"一句话标题","explanation":"两三句解释"}',
          ].join(' '),
          book: [
            '你是一个图书推荐助手，推荐一本真实存在、广为人知的经典书籍。',
            '书名和作者必须真实准确，严禁虚构；简介真实客观。',
            '只输出 json，格式：{"title":"书名","author":"作者","summary":"两三句简介","recommendation":"一句推荐理由"}',
          ].join(' '),
        }

        // 内置内容库：未配置 API key 时使用，保证离线也能扭。
        var BUILTIN = {
          joke: [
            { content: '面试官问我有什么特长，我说我特别能拖延。他说那你下周再来吧——我到现在还没去。' },
            { content: '医生说我缺乏运动，于是我办了张健身卡。后来发现，刷卡也算一种运动。' },
            { content: '我把闹钟设成早上六点，这样我就能每天在七点醒来，亲手把它关掉。' },
            { content: '我妈说我房间乱得像被抢劫过。我反驳说，抢劫犯看了都会留张字条：「无从下手」。' },
            { content: '我跟朋友说要减肥，朋友说别开玩笑。我说我是认真的——从明天开始，这个明天已经持续了三年。' },
            { content: '朋友问我最近在忙什么，我说在学做饭。他问做得好吃吗，我说至少烟雾报警器每次都给我打满分。' },
            { content: '我去健身房，教练问我目标是什么。我说想练到能徒手开罐头。教练沉默很久，递给我一个开罐器。' },
            { content: '为什么程序员分不清万圣节和圣诞节？因为 10 月 31 日（OCT 31）和 12 月 25 日（DEC 25）在八进制里相等。' },
          ],
          foreign: [
            { language: '英语', original: 'The early bird catches the worm.', translation: '早起的鸟儿有虫吃。' },
            { language: '英语', original: 'Practice makes perfect.', translation: '熟能生巧。' },
            { language: '日语', original: 'お疲れ様です。', translation: '辛苦了。' },
            { language: '日语', original: '一期一会。', translation: '一生一次，珍惜当下。' },
            { language: '法语', original: 'Bon appétit !', translation: '用餐愉快！' },
            { language: '西班牙语', original: 'Buenos días.', translation: '早上好。' },
            { language: '德语', original: 'Ich liebe dich.', translation: '我爱你。' },
            { language: '韩语', original: '감사합니다.', translation: '谢谢。' },
          ],
          knowledge: [
            { title: '蜜蜂靠「8 字舞」报信', explanation: '蜜蜂回巢后会跳一种 8 字形舞蹈，用方向和摆动次数告诉同伴花蜜的方向与距离。' },
            { title: '海拔越高，水的沸点越低', explanation: '标准大气压下水的沸点是 100°C；气压随海拔升高而下降，所以高原上水不到 100°C 就沸腾了。' },
            { title: '光速是宇宙的速度上限', explanation: '光在真空中每秒约走 30 万公里，任何信息或物质的传播速度都无法超过它。' },
            { title: '木星是太阳系最大的行星', explanation: '木星的体积能装下约 1300 个地球，质量比其他所有行星加起来还大两倍多。' },
            { title: '彩虹是阳光被水滴分解出来的', explanation: '阳光进入水滴后发生折射和反射，被分解成七种颜色，于是形成了彩虹。' },
            { title: '地球表面约七成是海洋', explanation: '海洋覆盖了地球约 71% 的表面，但海水含盐分，不能直接饮用。' },
            { title: '声音在水中比空气里传得快', explanation: '声音在空气中的速度约为每秒 340 米，而在水中可达到约 1500 米/秒。' },
            { title: '巧克力对猫狗有毒', explanation: '猫狗无法有效代谢巧克力里的可可碱，误食可能引起中毒甚至危及生命。' },
            { title: '金星是太阳系最热的行星', explanation: '虽然水星离太阳更近，但金星浓厚的二氧化碳大气造成强烈温室效应，表面温度超过 460°C。' },
            { title: '章鱼有三个心脏', explanation: '章鱼有两个鳃心负责把血液送到鳃部，一个体心负责把血泵向全身。' },
            { title: '人类每天分泌大量唾液', explanation: '一个成年人每天大约分泌 1 到 1.5 升唾液，用来湿润口腔和帮助消化。' },
            { title: '竹子是生长最快的植物之一', explanation: '某些竹子一天能长高几十厘米，是世界上生长最快的植物之一。' },
          ],
          book: [
            { title: '小王子', author: '安托万·德·圣-埃克苏佩里', summary: '一个来自小行星的男孩在各星球间的旅行见闻，用童话的方式讲述爱、孤独与责任。', recommendation: '篇幅短小却常读常新，适合想从故事里找回纯真的你。' },
            { title: '活着', author: '余华', summary: '主人公福贵历经家道中落与时代动荡，在一次次失去中依然坚韧地活下去。', recommendation: '沉重却充满力量，让你重新理解「活着」本身的分量。' },
            { title: '百年孤独', author: '加西亚·马尔克斯', summary: '布恩迪亚家族七代人的兴衰，魔幻现实主义笔法写尽一个家族的宿命与孤独。', recommendation: '魔幻与现实交织的巅峰之作，适合喜欢宏大叙事的读者。' },
            { title: '三体', author: '刘慈欣', summary: '人类与三体文明跨越光年的博弈，从文革时期一直延伸到宇宙尺度的文明兴亡。', recommendation: '硬科幻天花板，脑洞与格局兼具，看完会忍不住仰望星空。' },
            { title: '红楼梦', author: '曹雪芹', summary: '以贾府兴衰为背景，书写宝黛爱情与一群女子的命运，是中国古典小说的巅峰。', recommendation: '人物与细节极尽精妙，值得反复品读的传世经典。' },
            { title: '1984', author: '乔治·奥威尔', summary: '在极权统治的「大洋国」里，主人公温斯顿试图反抗无处不在的监视与思想控制。', recommendation: '反乌托邦经典，对权力与自由的警示至今仍振聋发聩。' },
            { title: '人类简史', author: '尤瓦尔·赫拉利', summary: '从认知革命、农业革命到科学革命，梳理智人如何一步步成为地球的主宰。', recommendation: '用清晰的大框架串起人类历史，适合想快速建立世界观的读者。' },
            { title: '围城', author: '钱锺书', summary: '以留学归来的方鸿渐为主线，用幽默犀利的笔触写尽婚姻、事业与人情的围城。', recommendation: '妙语连珠、金句频出，读起来轻松又耐人寻味。' },
          ],
        }

        // ---- state ----
        var storedKey = localStorage.getItem(STORAGE_KEY) || ''
        var state = {
          apiKey: storedKey,
          content: null,
          category: null,
          loading: storedKey !== '',
          error: null,
          showSettings: false,
          pending: false,
          drawId: 0,
        }

        // ---- DOM ----
        var page = document.getElementById('page')
        var stage = document.getElementById('stage')
        var errorEl = document.getElementById('error')
        var overlay = document.getElementById('overlay')
        var modalInput = document.getElementById('api-key-input')
        var saveBtn = document.getElementById('save-btn')

        // ---- helpers ----
        function esc(s) {
          return String(s == null ? '' : s)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;')
        }

        function randomCategory(excludeId) {
          var pool = excludeId ? CATEGORIES.filter(function (c) { return c.id !== excludeId }) : CATEGORIES
          return pool[Math.floor(Math.random() * pool.length)]
        }

        function parseJson(text) {
          try { return JSON.parse(text) } catch (e) { /* fallthrough */ }
          var fenced = text.match(/```(?:json)?\s*([\s\S]*?)```/i)
          if (fenced) {
            try { return JSON.parse(fenced[1]) } catch (e) { /* fallthrough */ }
          }
          var start = text.indexOf('{')
          var end = text.lastIndexOf('}')
          if (start !== -1 && end > start) {
            try { return JSON.parse(text.slice(start, end + 1)) } catch (e) { /* fallthrough */ }
          }
          throw new Error('无法解析模型返回的内容')
        }

        // 从内置内容库里随机取一条，避免与上一条重复。
        var lastBuiltin = {}

        function pickBuiltin(category) {
          var pool = BUILTIN[category.id] || []
          if (pool.length === 0) throw new Error('暂无内容')
          var idx = Math.floor(Math.random() * pool.length)
          if (pool.length > 1 && idx === lastBuiltin[category.id]) {
            idx = (idx + 1) % pool.length
          }
          lastBuiltin[category.id] = idx
          return Object.assign({ kind: category.id }, pool[idx])
        }

        async function generateContent(category, apiKey) {
          var res = await fetch(API_URL, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              Authorization: 'Bearer ' + apiKey,
            },
            body: JSON.stringify({
              model: MODEL,
              messages: [{ role: 'user', content: PROMPTS[category.id] }],
              temperature: 1.1,
              response_format: { type: 'json_object' },
            }),
          })

          if (!res.ok) {
            if (res.status === 401) throw new Error('API key 无效，点右上角重新设置')
            if (res.status === 429) throw new Error('请求太频繁或余额不足')
            if (res.status >= 500) throw new Error('服务暂时不可用，稍后再试')
            throw new Error('请求失败（' + res.status + '）')
          }

          var data = await res.json()
          var raw = (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || ''
          var parsed = parseJson(raw)
          return Object.assign({ kind: category.id }, parsed)
        }

        // ---- render ----
        function renderBody(content) {
          switch (content.kind) {
            case 'joke':
              return '<p class="body-joke">' + esc(content.content) + '</p>'
            case 'foreign':
              return '<p class="body-foreign">' + esc(content.original) + '</p>' +
                '<p class="translation">' + esc(content.translation) + '</p>' +
                '<p class="lang-tag">' + esc(content.language) + '</p>'
            case 'knowledge':
              return '<h2 class="body-title">' + esc(content.title) + '</h2>' +
                '<p class="body-text">' + esc(content.explanation) + '</p>'
            case 'book':
              return '<h2 class="body-title">' + esc(content.title) + '</h2>' +
                '<p class="body-author">' + esc(content.author) + '</p>' +
                '<p class="body-text">' + esc(content.summary) + '</p>' +
                '<p class="body-reco">' + esc(content.recommendation) + '</p>'
            default:
              return ''
          }
        }

        function renderCard() {
          if (state.content && state.category) {
            var c = state.category
            stage.innerHTML =
              '<article class="card" style="--accent:' + c.color + ';--tint:' + c.tint + '">' +
                '<span class="tag">' + esc(c.label) + '<em>' + esc(c.labelEn) + '</em></span>' +
                '<div class="card-body">' + renderBody(state.content) + '</div>' +
                '<div class="veil" id="veil"><div class="veil-inner">' +
                  '<div class="spinner"></div>' +
                  '<div class="loading-label">扭蛋中…</div>' +
                '</div></div>' +
              '</article>'
          } else if (state.loading) {
            stage.innerHTML =
              '<div class="boot"><div class="spinner"></div><div class="loading-label">扭蛋中…</div></div>'
          } else {
            stage.innerHTML = '<div class="boot boot-hint">点一下，扭一个</div>'
          }
          syncVeil()
        }

        function syncVeil() {
          var veil = document.getElementById('veil')
          if (veil) veil.style.display = state.loading ? 'grid' : 'none'
        }

        function renderError() {
          if (state.error) {
            errorEl.textContent = state.error
            errorEl.hidden = false
          } else {
            errorEl.hidden = true
          }
        }

        function syncModal() {
          overlay.hidden = !state.showSettings
          if (state.showSettings) {
            modalInput.value = state.apiKey
            modalInput.focus()
            saveBtn.disabled = !modalInput.value.trim()
          }
        }

        function render() {
          renderCard()
          renderError()
          syncModal()
        }

        // ---- actions ----
        async function draw() {
          if (state.pending) return
          state.pending = true
          var cat = randomCategory(state.category && state.category.id)
          var changed = false
          try {
            var result = state.apiKey
              ? await generateContent(cat, state.apiKey)
              : pickBuiltin(cat)
            state.category = cat
            state.content = result
            state.drawId++
            changed = true
          } catch (e) {
            state.error = e instanceof Error ? e.message : '生成失败，请重试'
          } finally {
            state.loading = false
            state.pending = false
          }
          if (changed) {
            renderCard()
          } else {
            syncVeil()
          }
          renderError()
        }

        function handlePageClick() {
          if (state.loading || state.showSettings) return
          state.loading = true
          state.error = null
          renderError()
          syncVeil()
          draw()
        }

        function handleSaveKey(key) {
          localStorage.setItem(STORAGE_KEY, key)
          state.apiKey = key
          state.showSettings = false
          state.content = null
          state.category = null
          state.error = null
          state.loading = true
          syncModal()
          renderError()
          renderCard()
          draw()
        }

        function openSettings() {
          state.showSettings = true
          syncModal()
        }

        function closeSettings() {
          state.showSettings = false
          syncModal()
        }

        function saveFromInput() {
          var v = modalInput.value.trim()
          if (v) handleSaveKey(v)
        }

        // ---- wire events ----
        page.addEventListener('click', handlePageClick)

        document.getElementById('gear').addEventListener('click', function (e) {
          e.stopPropagation()
          openSettings()
        })

        overlay.addEventListener('click', function (e) {
          e.stopPropagation()
          if (e.target === overlay) closeSettings()
        })

        document.getElementById('modal-close').addEventListener('click', function (e) {
          e.stopPropagation()
          closeSettings()
        })

        modalInput.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') saveFromInput()
        })

        modalInput.addEventListener('input', function () {
          saveBtn.disabled = !modalInput.value.trim()
        })

        saveBtn.addEventListener('click', function (e) {
          e.stopPropagation()
          saveFromInput()
        })

        // ---- init ----
        render()
        draw()
      })()
    </script>
  </body>
</html>
