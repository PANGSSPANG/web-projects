<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的网页小项目</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --text: #1f2933;
      --muted: #7b8794;
      --card: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .wrap { width: min(560px, 100%); text-align: center; }
    h1 { font-size: 28px; letter-spacing: 1px; }
    .subtitle { color: var(--muted); margin: 8px 0 28px; font-size: 14px; }
    .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 480px) { .cards { grid-template-columns: 1fr; } }
    .card {
      display: block;
      background: var(--card);
      border-radius: 18px;
      padding: 28px 20px;
      text-decoration: none;
      color: var(--text);
      box-shadow: 0 10px 30px rgba(31, 41, 51, 0.08);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .card:hover { transform: translateY(-4px); box-shadow: 0 16px 40px rgba(31, 41, 51, 0.14); }
    .card .icon { font-size: 40px; }
    .card .name { font-size: 18px; font-weight: 700; margin: 12px 0 6px; }
    .card .desc { font-size: 13px; color: var(--muted); line-height: 1.6; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>我的网页小项目</h1>
    <p class="subtitle">两个可直接使用的纯前端工具</p>
    <div class="cards">
      <a class="card" href="./pomodoro-timer/">
        <div class="icon">🍅</div>
        <div class="name">番茄钟</div>
        <div class="desc">番茄工作法计时器，专注 / 休息模式，环形倒计时</div>
      </a>
      <a class="card" href="./password-generator/">
        <div class="icon">🔐</div>
        <div class="name">密码生成器</div>
        <div class="desc">高强度随机密码，本地生成，带强度评估</div>
      </a>
    </div>
  </div>
</body>
</html>
