<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="安全、可定制的随机密码生成器，全部在本地浏览器生成。" />
  <title>密码生成器</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>🔐 密码生成器</h1>
      <p class="subtitle">本地生成 · 数据不会上传</p>
    </header>

    <section class="output">
      <input type="text" id="password" readonly aria-label="生成的密码" placeholder="点击下方按钮生成" />
      <button id="copy" aria-label="复制密码" title="复制">⧉</button>
    </section>

    <div class="strength">
      <div class="strength-bar"><span id="strengthFill"></span></div>
      <div class="strength-meta">
        <span id="strengthLabel">—</span>
        <span id="entropy"></span>
      </div>
    </div>

    <section class="options">
      <label class="range">
        <span>长度 <strong id="lenVal">16</strong></span>
        <input type="range" id="length" min="4" max="64" value="16" />
      </label>

      <div class="checks">
        <label class="check"><input type="checkbox" id="upper" checked /> 大写字母 A–Z</label>
        <label class="check"><input type="checkbox" id="lower" checked /> 小写字母 a–z</label>
        <label class="check"><input type="checkbox" id="number" checked /> 数字 0–9</label>
        <label class="check"><input type="checkbox" id="symbol" checked /> 符号 !@#$%…</label>
        <label class="check"><input type="checkbox" id="exclude" /> 排除易混淆字符（0 O 1 l I）</label>
      </div>
    </section>

    <button class="btn btn-primary" id="generate">生成密码</button>
  </main>
  <script src="app.js"></script>
</body>
</html>
